# the live system's: root is logged in on every tty
hostname = chamesle-live
boot-services = {udev,modules,dbus,iwd,network}
modules = {evdev,psmouse,i8042,atkbd,usbhid,hid_generic,hid_multitouch,i2c_hid_acpi,xhci_pci,virtio_net,e1000,e1000e,r8169,8139too,igb,iwlwifi}
ttys = {tty1,tty2,tty3,tty4,tty5,tty6,ttyS0}
getty = agetty --autologin root --noclear $tty linux
getty-ttyS0 = agetty --autologin root -L $tty 115200 vt100
