# read by init, rc and service; one setting per line, lists in braces
hostname = chamesle

# started in this order at boot, stopped in reverse at shutdown
#boot-services = {NetworkManager,LightDM,dbus}
boot-services = {udev,modules,network}

# kernel modules to load by hand
modules = {}

# $tty is the name of the line; getty-NAME overrides getty for one line
ttys = {tty1,ttyS0}
getty = agetty --noclear -n -l /usr/bin/mksh $tty linux
getty-ttyS0 = agetty -L -n -l /usr/bin/mksh $tty 115200 vt100
